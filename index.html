<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\Windows\System32\cmd.exe</title>
    <style>
        body {
            background-color: black;
            color: #00FF00; /* Verde hacker */
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 16px;
            margin: 10px;
            overflow: hidden; /* Evita que se vea la barra de scroll */
        }
    </style>
</head>
<body>

    <div id="consola"></div>

    <script>
        const consola = document.getElementById('consola');
        
        const comandos = [
            "Conectando a IP local...",
            "Anulando firewall de seguridad...",
            "Accediendo a sistema de archivos...",
            "Extrayendo datos de navegación... [ÉXITO]",
            "Descifrando contraseñas...",
            "Enviando paquetes al servidor...",
            "Acceso remoto concedido.",
            "Clonando disco duro..."
        ];

        let contador = 0;

        function escribirHacker() {
            let textoAleatorio = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            let fraseAleatoria = comandos[Math.floor(Math.random() * comandos.length)];
            
            consola.innerHTML += "C:\\Windows\\System32> " + fraseAleatoria + " 0x" + textoAleatorio + "<br>";
            window.scrollTo(0, document.body.scrollHeight);
            
            contador++;

            // Se detiene después de escupir 80 líneas
            if (contador > 80) {
                clearInterval(intervalo);
                terminarBroma();
            }
        }

        // VELOCIDAD: 15 milisegundos (¡Súper rápido!)
        const intervalo = setInterval(escribirHacker, 15);

        function terminarBroma() {
            consola.innerHTML += "<br><span style='color:red;'>PROCESO COMPLETADO. REDIRIGIENDO...</span>";
            
            setTimeout(() => {
                // AQUÍ ES DONDE SUCEDE LA REDIRECCIÓN AUTOMÁTICA
                // Cambia "pagina2.html" por el nombre de tu otra página o un enlace real (ej: "https://youtube.com")
                window.location.href = "pagina2.html"; 
                
            }, 1000); // Espera 1 segundo para que la víctima lea el texto rojo antes de saltar
        }
    </script>
</body>
</html>
